<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, Maliha Annjum!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #f6d365 100%);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      color: #4a2545;
      text-align: center;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Overlay Screen (Required by browsers before playing audio) */
    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #ff758c 0%, #ff7eb3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.7s ease, transform 0.7s ease;
      padding: 20px;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.1);
    }

    .gift-box {
      font-size: 90px;
      cursor: pointer;
      animation: bounce 1.4s infinite ease-in-out;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.2));
      user-select: none;
    }
    .tap-text {
      margin-top: 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .tap-sub {
      margin-top: 6px;
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-18px) rotate(-4deg); }
      75% { transform: translateY(-10px) rotate(4deg); }
    }

    /* Main Birthday Card */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 40px 30px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(130, 35, 85, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.9);
      transform: scale(0.9);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }
    .card.show {
      transform: scale(1);
      opacity: 1;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.3rem;
      line-height: 1.15;
      background: linear-gradient(45deg, #ff477e, #ff9900);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    .message {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #5c3756;
      margin-bottom: 24px;
    }

    /* Interactive Cake */
    .cake-container {
      position: relative;
      width: 180px;
      height: 140px;
      margin: 25px auto 15px;
      cursor: pointer;
      user-select: none;
    }
    .plate {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 14px;
      background: #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .cake-bottom {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 145px;
      height: 45px;
      background: #ff85a1;
      border-radius: 12px 12px 4px 4px;
      border-bottom: 6px solid #f75c82;
    }
    .cake-top {
      position: absolute;
      bottom: 59px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 38px;
      background: #fbb1bd;
      border-radius: 12px 12px 0 0;
    }
    .icing {
      position: absolute;
      top: 0;
      width: 100%;
      height: 14px;
      background: #fff;
      border-radius: 12px 12px 8px 8px;
    }
    .candles {
      position: absolute;
      bottom: 97px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
    }
    .candle {
      width: 10px;
      height: 28px;
      background: repeating-linear-gradient(45deg, #fff, #fff 4px, #4cc9f0 4px, #4cc9f0 8px);
      border-radius: 3px;
      position: relative;
    }
    .flame {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 16px;
      background: radial-gradient(circle at 50% 80%, #fff 10%, #ffd166 50%, #f77f00 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 0 0 12px #ffd166, 0 0 24px #f77f00;
      animation: flicker 0.25s infinite alternate;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0);
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
      100% { transform: translateX(-50%) scale(1.08) rotate(3deg); }
    }

    .hint {
      font-size: 0.9rem;
      color: #8c5e83;
      margin-bottom: 22px;
      font-weight: 700;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(45deg, #ff477e, #ff7096);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 71, 126, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 71, 126, 0.45);
    }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: #fff;
      color: #ff477e;
      border: 2px solid #ff7096;
      box-shadow: none;
    }

    /* Floating Balloons */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 55px;
      height: 68px;
      border-radius: 50%;
      opacity: 0.85;
      z-index: 1;
      animation: floatUp linear infinite;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -35px;
      left: 50%;
      width: 2px;
      height: 35px;
      background: rgba(255,255,255,0.7);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-125vh) rotate(12deg); }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- Initial Tap Screen -->
  <div id="overlay" onclick="startSurprise()">
    <div class="gift-box">🎁</div>
    <div class="tap-text" id="overlay-title">A Surprise for Maliha Annjum!</div>
    <div class="tap-sub">(Tap the gift to open & turn sound on)</div>
  </div>

  <!-- Main Card -->
  <div class="card" id="card">
    <h1 id="headline">Happy Birthday, Maliha Annjum! 🎉</h1>
    <p class="message" id="wish-message">
      piddi sa, chota sa, babu wala Maliha hain aap mera. 💕✨
    </p>

    <div class="cake-container" onclick="toggleCandles()" title="Click to blow out candles!">
      <div class="candles">
        <div class="candle"><div class="flame" id="f1"></div></div>
        <div class="candle"><div class="flame" id="f2"></div></div>
        <div class="candle"><div class="flame" id="f3"></div></div>
      </div>
      <div class="cake-top"><div class="icing"></div></div>
      <div class="cake-bottom"></div>
      <div class="plate"></div>
    </div>
    <div class="hint" id="cake-hint">🎂 Tap the cake to make a wish & blow out the candles!</div>

    <div class="btn-row">
      <button onclick="playBirthdaySong()">🎵 Replay Song</button>
      <button class="secondary" onclick="burstConfetti()">🎊 More Confetti</button>
    </div>
  </div>

  <script>
    // Allow optional URL override if ever needed (?name=...&msg=...)
    const params = new URLSearchParams(window.location.search);
    const personName = params.get('name');
    const customMsg = params.get('msg');

    if (personName) {
      document.getElementById('overlay-title').textContent = `A Surprise for ${personName}!`;
      document.getElementById('headline').textContent = `Happy Birthday, ${personName}! 🎉`;
    }
    if (customMsg) {
      document.getElementById('wish-message').textContent = customMsg;
    }

    // Web Audio API Synthesizer for "Happy Birthday to You"
    let audioCtx = null;
    let isPlaying = false;

    const notes = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, Bb4: 466.16, C5: 523.25
    };

    const melody = [
      ['C4', 0.3], ['C4', 0.15], ['D4', 0.45], ['C4', 0.45], ['F4', 0.45], ['E4', 0.9],
      ['C4', 0.3], ['C4', 0.15], ['D4', 0.45], ['C4', 0.45], ['G4', 0.45], ['F4', 0.9],
      ['C4', 0.3], ['C4', 0.15], ['C5', 0.45], ['A4', 0.45], ['F4', 0.45], ['E4', 0.45], ['D4', 0.9],
      ['Bb4', 0.3], ['Bb4', 0.15], ['A4', 0.45], ['F4', 0.45], ['G4', 0.45], ['F4', 1.1]
    ];

    function playTone(freq, startTime, duration) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    }

    function playBirthdaySong() {
      if (isPlaying) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isPlaying = true;
      let currentTime = audioCtx.currentTime + 0.1;

      melody.forEach(([note, dur]) => {
        playTone(notes[note], currentTime, dur * 0.95);
        currentTime += dur;
      });

      const totalDuration = melody.reduce((sum, [, d]) => sum + d, 0);
      setTimeout(() => { isPlaying = false; }, totalDuration * 1000);
    }

    // Start Surprise on Tap
    function startSurprise() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('card').classList.add('show');
      playBirthdaySong();
      burstConfetti();
      spawnBalloons();
    }

    // Candles Interaction
    let candlesLit = true;
    function toggleCandles() {
      candlesLit = !candlesLit;
      ['f1', 'f2', 'f3'].forEach(id => {
        document.getElementById(id).classList.toggle('out', !candlesLit);
      });
      const hint = document.getElementById('cake-hint');
      if (!candlesLit) {
        hint.textContent = '✨ Wish made! Tap the cake again to relight.';
        burstConfetti();
      } else {
        hint.textContent = '🎂 Tap the cake to make a wish & blow out the candles!';
      }
    }

    // Floating Balloons
    function spawnBalloons() {
      const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#c77dff'];
      for (let i = 0; i < 12; i++) {
        const b = document.createElement('div');
        b.className = 'balloon';
        b.style.left = Math.random() * 95 + 'vw';
        b.style.background = colors[i % colors.length];
        b.style.animationDuration = (7 + Math.random() * 6) + 's';
        b.style.animationDelay = (Math.random() * 4) + 's';
        document.body.appendChild(b);
      }
    }

    // Confetti Engine
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let pieces = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti() {
      const colors = ['#ff477e', '#ff9900', '#ffd166', '#06d6a0', '#4cc9f0', '#b5179e'];
      for (let i = 0; i < 120; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.7) * 18,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.vx *= 0.98;
        p.rot += p.vRot;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();

        if (p.y > canvas.height + 20) pieces.splice(idx, 1);
      });
      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();
  </script>
</body>
</html>
